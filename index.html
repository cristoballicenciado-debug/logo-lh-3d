<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo L&amp;H 3D</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
</style>
</head>
<body>
<model-viewer
  src="lopez_henriquez_logo_3d_corregido%20(1).glb"
  alt="Logo 3D de López &amp; Henríquez Soluciones Jurídicas"
  auto-rotate
  auto-rotate-delay="0"
  rotation-per-second="30deg"
  interaction-prompt="none"
  camera-controls
  disable-zoom
  disable-pan
  shadow-intensity="0"
  exposure="1"
  loading="eager">
</model-viewer>
</body>
</html>
